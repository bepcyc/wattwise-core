# Forgejo-only release workflow.
#
# WHY THIS EXISTS (and is not in .github): the shared ci.yml release job needs the
# full heavy gate and GitHub-style hosted runners. The self-hosted Forgejo instance
# has a single act_runner; running the whole gate there is unreliable, and Forgejo
# does not fire a tag event when `on.push` lists both `branches` and `tags`. This
# dedicated workflow triggers ONLY on a v* tag and runs in host mode (runs-on: native)
# so `docker build` can use the host's rootless Docker. The artifact it ships is the
# same `just release` (FORGE_PROVIDER=forgejo) that ci.yml would run; the code was
# already gated green on the GitHub mirror for the same commit.
name: release-forgejo

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: native
    env:
      FORGE_PROVIDER: forgejo
      VERSION: ${{ github.ref_name }}
      FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # Forgejo's built-in OCI registry, reached directly (the public host uses an
      # ACME cert for a different name; localhost:3000 avoids the TLS mismatch).
      WW_REGISTRY: homeassistant:3000
      WW_OWNER: bepcyc
      FORGEJO_API_URL: http://localhost:3000/api/v1
      GITHUB_REPOSITORY: bepcyc/wattwise-core
    steps:
      - name: build + scan + push image, create Forgejo release
        run: |
          exec > /tmp/ww-release-job.log 2>&1   # mirror to a host file (Forgejo log API is awkward to read)
          set -xeuo pipefail
          # host-mode jobs get a minimal PATH; restore nix + the user profile (just/uv).
          export PATH="/etc/profiles/per-user/bepcyc/bin:/run/current-system/sw/bin:/run/wrappers/bin:${PATH:-}"
          export DOCKER_HOST="unix:///run/user/$(id -u)/docker.sock"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          command -v nix just uv git docker
          work="$(mktemp -d)"
          git clone --quiet "http://bepcyc:${FORGEJO_TOKEN}@localhost:3000/bepcyc/wattwise-core.git" "$work"
          cd "$work"
          git fetch --quiet origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          git checkout --quiet "tags/${VERSION}"
          # Pin a job-local docker config so the login the push uses is the SAME one,
          # regardless of HOME inside the nix-shell subshell (host-mode HOME differs).
          export DOCKER_CONFIG="${work}/.docker"; mkdir -p "$DOCKER_CONFIG"
          echo "${FORGEJO_TOKEN}" | docker login "${WW_REGISTRY}" -u bepcyc --password-stdin
          # trivy + syft are not on the host PATH; provide them for scan.sh / sbom.sh.
          # DOCKER_CONFIG/DOCKER_HOST are exported, so the push inside the shell reuses the login.
          nix shell nixpkgs#trivy nixpkgs#syft -c just release
